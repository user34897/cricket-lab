# Builds the Cricket Lab data from Cricsheet and publishes the site to GitHub Pages.
# Runs: every Monday, whenever you push a change, and when you press "Run workflow".
name: Build and publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"   # 05:00 UTC every Monday
  workflow_dispatch:       # adds the "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write

# Only one publish at a time; a newer run replaces an older one that hasn't finished.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Cricsheet data and build summary files
        run: python scripts/build_data.py

      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
